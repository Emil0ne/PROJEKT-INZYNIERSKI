services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Brak POSTGRES_PASSWORD - skopiuj .env.example do .env}
      TZ: Europe/Warsaw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tabele i dane demo tworzą migracje EF Core (backend/TravelAssistant.Data):
    #   dotnet tool restore && dotnet ef database update --project backend/TravelAssistant.Data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
